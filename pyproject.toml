[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photocraft"
version = "0.1.0"
description = "A lightweight, extensible photo-processing plugin & action library."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.scripts]
photocraft = "photocraft.__main__:main"

[tool.setuptools.packages.find]
include = ["photocraft*"]
